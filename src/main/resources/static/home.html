<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>欢迎来到我的主页</title>
    <style>
        body { font-family: Arial; max-width: 800px; margin: 80px auto; padding: 0 20px; text-align: center; }
        h1 { color: #333; margin-bottom: 10px; }
        .nav { margin-top: 40px; }
        .nav a { display: inline-block; margin: 10px; padding: 12px 24px; background: #4CAF50; color: white; text-decoration: none; border-radius: 4px; }
        .nav a:hover { background: #45a049; }
        .logout { display: inline-block; margin: 10px; padding: 12px 24px; background: #999; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        .logout:hover { background: #777; }
        .signature { position: fixed; bottom: 10px; left: 0; width: 100%; text-align: center; color: #999; font-size: 12px; }
    </style>
</head>
<body>
    <h1 id="welcome">欢迎来到我的主页</h1>
    <div class="nav">
        <a href="/index.html">学生管理</a>
        <a href="/courses.html">课程管理</a>
        <button class="logout" onclick="logout()">退出登录</button>
    </div>
    <script>
        // 获取当前登录用户名，拼进欢迎语
        fetch('/currentUser')
            .then(res => res.json())
            .then(data => {
                if (data.username) {
                    document.getElementById('welcome').textContent = '欢迎用户 ' + data.username + ' 来到我的主页';
                } else {
                    window.location.href = '/login.html';
                }
            })
            .catch(() => {});

        function logout() {
            fetch('/logout', { method: 'POST' })
                .then(() => { window.location.href = '/login.html'; });
        }
    </script>
    <footer class="signature">cly202405315310</footer>
</body>
</html>
