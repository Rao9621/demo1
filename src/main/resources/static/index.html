<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>学生管理系统</title>
    <style>
        body { font-family: Arial; max-width: 800px; margin: 20px auto; padding: 0 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #4CAF50; color: white; }
        input { margin: 5px; padding: 5px; }
        button { background-color: #4CAF50; color: white; border: none; padding: 8px 16px; cursor: pointer; margin: 2px; }
        button.delete { background-color: #f44336; }
        button.edit { background-color: #2196F3; }
        .form { background: #f9f9f9; padding: 15px; border-radius: 5px; margin-top: 20px; }
        .topbar { display: flex; justify-content: space-between; align-items: center; }
        .logout { background-color: #999; color: white; border: none; padding: 8px 16px; cursor: pointer; border-radius: 4px; }
        .logout:hover { background-color: #777; }
    </style>
</head>
<body>
<div class="topbar">
    <h1>学生管理系统</h1>
    <button class="logout" onclick="logout()">退出登录</button>
</div>

<div class="form">
    <h3>添加学生</h3>
    <input id="name" placeholder="姓名">
    <input id="age" type="number" placeholder="年龄">
    <input id="score" type="number" step="0.1" placeholder="成绩">
    <button onclick="addStudent()">添加</button>
</div>

<table>
    <thead>
    <tr><th>ID</th><th>姓名</th><th>年龄</th><th>成绩</th><th>操作</th></tr>
    </thead>
    <tbody id="studentList"></tbody>
</table>

<script>
    // 查询所有学生
    function loadStudents() {
        fetch('/students')
            .then(res => res.json())
            .then(data => {
                const list = document.getElementById('studentList');
                list.innerHTML = '';
                data.forEach(s => {
                    list.innerHTML += `
                            <tr>
                                <td>${s.id}</td>
                                <td>${s.name}</td>
                                <td>${s.age}</td>
                                <td>${s.score}</td>
                                <td>
                                    <button class="edit" onclick="editStudent(${s.id})">修改</button>
                                    <button class="delete" onclick="deleteStudent(${s.id})">删除</button>
                                </td>
                            </tr>
                        `;
                });
            });
    }

    // 添加学生
    function addStudent() {
        const name = document.getElementById('name').value;
        const age = document.getElementById('age').value;
        const score = document.getElementById('score').value;
        fetch('/students', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({name, age: parseInt(age), score: parseFloat(score)})
        }).then(() => {
            loadStudents();
            document.getElementById('name').value = '';
            document.getElementById('age').value = '';
            document.getElementById('score').value = '';
        });
    }

    // 删除学生
    function deleteStudent(id) {
        if (confirm('确定删除吗？')) {
            fetch('/students/' + id, {method: 'DELETE'}).then(() => loadStudents());
        }
    }

    // 修改学生
    function editStudent(id) {
        const name = prompt('新姓名：');
        const age = prompt('新年龄：');
        const score = prompt('新成绩：');
        if (name && age && score) {
            fetch('/students/' + id, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({name, age: parseInt(age), score: parseFloat(score)})
            }).then(() => loadStudents());
        }
    }

    function logout() {
        fetch('/logout', { method: 'POST' })
            .then(() => { window.location.href = '/login.html'; });
    }

    loadStudents();
</script>
<footer style="text-align:center;color:#999;margin-top:40px;font-size:12px;">cly202405315310</footer>
</body>
</html>
